name: Linux
on: [push, pull_request, workflow_dispatch]
jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libgtk-3-dev libxtst-dev xvfb xauth rpm zip unzip cpio
      - run: sh package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            build/linux/UltimateAutoClicker-1.2.2-Linux-*
            build/linux/SHA256SUMS-linux.txt
